px"><tspan x="146.5" dy="0">Predictions agreed IN ADVANCE</tspan><tspan x="146.5" dy="17.666667">by proponents of two rival theories</tspan><tspan x="146.5" dy="17.666667">(Dehaene and Tononi)</tspan></text></g><g class="ZGVmZW5k warn"><g class="shape" ><rect x="1282" y="0" width="273" height="98" rx="4" stroke="#e2664f" fill="transparent" style="stroke-width:3;stroke-dasharray:12.000000,11.666896;" /></g><text x="1418.5" y="38.5" fill="#e2664f" class="text-bold" style="text-anchor:middle;font-size:16px"><tspan x="1418.5" dy="0">Seth, Goff and others defend IIT:</tspan><tspan x="1418.5" dy="17.666667">calling a theory wrong is not</tspan><tspan x="1418.5" dy="17.666667">calling it pseudoscience</tspan></text></g><g class="KGp1biAtJmd0OyBzZXApWzBd edge"><marker id="mk-d2-2555670036-3313868789" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#8f8a82" class="connection" stroke-width="2" /> </marker><path d="M 659 124 C 753 124 801 124 892.5 124" stroke="#8f8a82" fill="none" class="connection" style="stroke-width:2;" marker-end="url(#mk-d2-2555670036-3313868789)" mask="url(#d2-2555670036)" /><text x="777" y="130" fill="#8f8a82" class="text-italic" style="text-anchor:middle;font-size:16px">press coverage</text></g><g class="KHNlcCAtJmd0OyBwdWIpWzBd edge"><path d="M 1144.332504 172.89968 C 1198 193.600006 1226.300049 199 1279.5 199" stroke="#8f8a82" fill="none" class="connection" style="stroke-width:2;" marker-end="url(#mk-d2-2555670036-3313868789)" mask="url(#d2-2555670036)" /></g><g class="KGRlc2lnbiAtJmd0OyBqdW4pWzBd edge"><path d="M 294.5 124 C 349 124 377 124 429 124" stroke="#8f8a82" fill="none" class="connection" style="stroke-width:2;" marker-end="url(#mk-d2-2555670036-3313868789)" mask="url(#d2-2555670036)" /></g><g class="KHNlcCAtJmd0OyBkZWZlbmQpWzBd edge-warn"><marker id="mk-d2-2555670036-3901875443" markerWidth="10" markerHeight="12" refX="7" refY="6" vie